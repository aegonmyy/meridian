[profile.default]
src = "src"
out = "out"
libs = ["lib"]
fs_permissions = [{ access = "write", path = "./" }]
optimizer = true
optimizer_runs = 1
via_ir = true

[invariant]
runs = 100
depth = 150
fail_on_revert = true


# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
